[package]
name = "hypergrab"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.31"
chrono = "0.4"
csv = "1.3"
calamine = "0.26"
rfd = "0.14"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Serve solo ai test per costruire un XLSX minimo in memoria.
# Versione fissata: calamine 0.26 non compila con zip >= 2.5.
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
